[project]
name = "xauscalp"
version = "0.1.0"
description = "Research-first XAUUSD scalping system (Python research + MQL5 execution)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
ml = ["scikit-learn>=1.4", "lightgbm>=4.3"]
dashboard = ["streamlit>=1.35"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xauscalp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# dict(...) keyword calls are used deliberately in tests for readable fixtures
extend-ignore = ["C408"]
